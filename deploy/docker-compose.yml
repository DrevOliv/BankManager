# Runs BankManager from the published image; no source code needed on the server.
#
#   1. Copy this file and .env.example (saved as .env) to a folder on the server.
#   2. Set POSTGRES_PASSWORD (and BANKMANAGER_IMAGE if you publish under another name) in .env.
#   3. docker compose up -d
#
# Update later with: docker compose pull && docker compose up -d

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankmanager
      POSTGRES_USER: bankmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankmanager -d bankmanager"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${BANKMANAGER_IMAGE:-drevoliv/bankmanager:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bankmanager:${POSTGRES_PASSWORD}@db:5432/bankmanager
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TZ: ${TZ:-Europe/Stockholm}
    ports:
      - "${APP_PORT:-8080}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db-data:
